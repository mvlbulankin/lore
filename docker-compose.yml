services:
  lore:
    image: lore
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./data/prepared:/data/prepared:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5